<template>
    <lightning-card title="Data Cloud Revenue Insights" icon-name="standard:dataset">
        <template lwc:if={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                Couldn't load Data Cloud insights: {error}
            </div>
        </template>

        <template lwc:if={hasData}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-3">
                        <p class="slds-text-title_caps">Total Revenue</p>
                        <p class="slds-text-heading_medium">{formattedRevenue}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <p class="slds-text-title_caps">Orders</p>
                        <p class="slds-text-heading_medium">{briefing.revenue.orderCount}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <p class="slds-text-title_caps">Avg Line</p>
                        <p class="slds-text-heading_medium">{formattedAvg}</p>
                    </div>
                </div>

                <template lwc:if={briefing.engagement}>
                    <div class="slds-m-top_medium slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <p class="slds-text-title_caps">RFM Score</p>
                            <span class={rfmBadgeClass}>{briefing.engagement.rfmScore} / 100</span>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <p class="slds-text-title_caps">Days Since Last Order</p>
                            <p>{briefing.engagement.recencyDays}</p>
                        </div>
                    </div>
                </template>

                <template lwc:if={hasSegments}>
                    <div class="slds-m-top_medium">
                        <p class="slds-text-title_caps">Data Cloud Segments</p>
                        <template for:each={segmentList} for:item="s">
                            <span key={s.name} class="slds-badge slds-theme_inverse slds-m-right_x-small">{s.label}</span>
                        </template>
                    </div>
                </template>

                <div class="slds-m-top_medium">
                    <p class="slds-text-title_caps slds-m-bottom_x-small">Top Product Families (org-wide)</p>
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th>Family</th>
                                <th class="slds-text-align_right">Revenue</th>
                                <th class="slds-text-align_right">Orders</th>
                                <th class="slds-text-align_right">Accounts</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={topFamilies} for:item="f">
                                <tr key={f.family}>
                                    <td>{f.displayFamily}</td>
                                    <td class="slds-text-align_right">{f.displayRevenue}</td>
                                    <td class="slds-text-align_right">{f.orderCount}</td>
                                    <td class="slds-text-align_right">{f.accountReach}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>

        <template lwc:if={showEmpty}>
            <div class="slds-p-around_medium slds-text-color_weak">
                No Data Cloud orders recorded for this account yet.
            </div>
        </template>
    </lightning-card>
</template>
