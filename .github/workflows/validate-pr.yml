name: Validate PR

on:
  pull_request:
    branches: [main]

# We need write access to id-token (not used here, future-proof for OIDC),
# pull-requests for the comment, and contents to checkout.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Pattern 1: Matrix Strategy
  # Validate the same change against multiple orgs in parallel.
  # In a real shop this would be FSC sandbox + Health Cloud sandbox + ...
  # For the demo we have prod-demo (treated as production-mirror sandbox)
  # and sandbox-demo (treated as developer sandbox).
  # ---------------------------------------------------------------------------
  validate:
    name: Validate against ${{ matrix.org_alias }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # Let all matrix legs report; don't stop the first failure from masking the others.
      matrix:
        org_alias: [prod, sandbox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin Node 20: the SF CLI crashes on the runner's new Node 24 default with
      # an "unsettled top-level await" error (exit 13) before it can authenticate.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      - name: Authenticate to ${{ matrix.org_alias }}
        run: |
          # Pattern 2 / security best-practice from skill v2.0.0:
          # Use process substitution so the auth URL is never written to disk.
          # On a real shop this would be JWT Bearer flow with --jwt-key-file <(printf '%s' "$KEY")
          # — Auth URL here only because trial Dev Hubs can't deploy ConnectedApp metadata
          # to scratch orgs (a known restriction). The security pattern is identical.
          sf org login sfdx-url \
            --sfdx-url-file <(printf '%s' "${{ secrets[format('SFDX_AUTH_URL_{0}', matrix.org_alias)] }}") \
            --alias ${{ matrix.org_alias }}-target

      - name: Run validation deploy with tests
        id: validation
        run: |
          mkdir -p test-results
          # `validate` does NOT actually deploy — it just runs metadata checks + tests.
          # The Job ID it returns is what Pattern 3 (Quick Deploy) reuses on merge to main.
          # Note: SF CLI exits non-zero on validation failure (which is what we want),
          # but the JSON result still contains useful diagnostics — capture both.
          set +e
          sf project deploy validate \
            --target-org ${{ matrix.org_alias }}-target \
            --source-dir force-app \
            --test-level RunLocalTests \
            --wait 30 \
            --json > test-results/validate.json
          EXIT_CODE=$?
          set -e

          # Always parse what we can.
          JOB_ID=$(jq -r '.result.id // empty' test-results/validate.json)
          STATUS=$(jq -r '.result.status // empty' test-results/validate.json)
          MESSAGE=$(jq -r '.message // empty' test-results/validate.json)

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Validation Job ID: $JOB_ID (status: $STATUS)"

          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::Salesforce validation failed: $MESSAGE"
            # Surface failed test details if any.
            jq -r '.result.details.runTestResult.failures[]? | "  ❌ \(.name).\(.methodName): \(.message)"' test-results/validate.json || true
            exit 1
          fi

      - name: Validate code coverage
        run: |
          # Pull the org-wide coverage from the validate result. The skill v2.0.0
          # corrected the original bug here: testRunCoverage is a numeric percentage,
          # not a string with a '%' suffix, so no tr/cut needed.
          COVERAGE=$(jq -r '.result.details.runTestResult.codeCoverage[] | select(.name=="BookingService") | (.numLocations - .numLocationsNotCovered) / .numLocations * 100' test-results/validate.json | head -1)
          REQUIRED=${{ vars.TEST_COVERAGE_REQUIRED || 75 }}

          if [[ -z "$COVERAGE" || "$COVERAGE" == "null" ]]; then
            echo "::warning::Could not extract coverage; skipping gate"
            exit 0
          fi

          # awk for portable float comparison (bc not on every runner image).
          if awk -v c="$COVERAGE" -v r="$REQUIRED" 'BEGIN { exit !(c < r) }'; then
            echo "::error::Code coverage ${COVERAGE}% on BookingService is below required ${REQUIRED}%"
            exit 1
          fi
          echo "✅ Code coverage ${COVERAGE}% on BookingService (>= ${REQUIRED}%)"

      - name: Capture validation Job ID for Quick Deploy (prod only)
        if: matrix.org_alias == 'prod' && steps.validation.outputs.status == 'Succeeded'
        run: |
          # Pattern 3 (Quick Deploy) setup: write the Job ID + a timestamp so the
          # deploy workflow can age-check it (Salesforce-side validations expire
          # after 4 calendar days regardless of GitHub artifact retention).
          mkdir -p validation-artifact
          echo "${{ steps.validation.outputs.job_id }}" > validation-artifact/job_id.txt
          date -u +%s > validation-artifact/timestamp.txt
          cat validation-artifact/job_id.txt validation-artifact/timestamp.txt

      - name: Upload Job ID artifact
        if: matrix.org_alias == 'prod' && steps.validation.outputs.status == 'Succeeded'
        uses: actions/upload-artifact@v4
        with:
          name: validation-job-id
          path: validation-artifact/
          retention-days: 7   # Match Salesforce's 4-day cliff with a small buffer; longer would mislead.

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.validation.outputs.status }}' || 'Failed';
            const jobId = '${{ steps.validation.outputs.job_id }}' || 'n/a';
            const org = '${{ matrix.org_alias }}';
            const emoji = status === 'Succeeded' ? '✅' : '❌';
            const body = `${emoji} **${org}**: validation ${status} (Job ID: \`${jobId}\`)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ---------------------------------------------------------------------------
  # SCA gate (added at account-team request): Static + Software Composition Analysis.
  # Salesforce Code Analyzer v5 bundles two distinct concerns under one gate:
  #   - SAST  : PMD (Apex security/quality) + ESLint (LWC) — analyses YOUR code.
  #   - SCA   : Retire.js — flags third-party JS libraries with known CVEs (the
  #             literal "software composition" / supply-chain check).
  # Runs against source only — NO org auth, NO data access — so it's the fastest,
  # safest gate and runs fully in parallel with the matrix validation above.
  # The gate blocks only on Critical/High (severity 1–2); Moderate/Low/Info are
  # captured as evidence but don't fail the build — high signal, low noise.
  # NOTE: Retire.js needs JS/LWC to find dependency CVEs; on an Apex-only repo the
  # SCA engine simply reports clean and PMD security rules carry the gate.
  # ---------------------------------------------------------------------------
  sca:
    name: Static + composition analysis (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PMD / CPD / Graph Engine need a real JDK; pin it so the Apex SAST rules
      # actually run (without Java the engines report as Critical 'engine could
      # not instantiate' errors and the gate fails for the wrong reason).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pin Node 20: SF CLI crashes on the runner's Node 24 default (see matrix job).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI + Code Analyzer
        run: |
          npm install -g @salesforce/cli@latest
          sf plugins install code-analyzer@latest
          sf code-analyzer rules --rule-selector Recommended --view table >/dev/null

      - name: Run Code Analyzer (SAST + SCA)
        id: sca
        run: |
          mkdir -p sca-results
          # --severity-threshold 2 makes the CLI exit non-zero on any Critical(1)
          # or High(2) finding. That exit code IS the gate; the jq below is only
          # for a friendly summary and is fully guarded so a parse change can
          # never silently pass or break the build.
          set +e
          sf code-analyzer run \
            --workspace force-app \
            --rule-selector Recommended \
            --severity-threshold 2 \
            --output-file sca-results/code-analyzer.sarif \
            --output-file sca-results/code-analyzer.html \
            --output-file sca-results/code-analyzer.json
          EXIT_CODE=$?
          set -e

          HIGH=$(jq '[.violations[]? | select(.severity <= 2)] | length' sca-results/code-analyzer.json 2>/dev/null || echo 0)
          TOTAL=$(jq '.violations | length' sca-results/code-analyzer.json 2>/dev/null || echo 0)
          echo "high=${HIGH:-0}" >> "$GITHUB_OUTPUT"
          echo "total=${TOTAL:-0}" >> "$GITHUB_OUTPUT"

          {
            echo "### SCA gate"
            echo "- **Engines**: PMD + ESLint (SAST), Retire.js (SCA)"
            echo "- **Critical/High**: ${HIGH:-0}"
            echo "- **Total findings**: ${TOTAL:-0}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::SCA gate failed — ${HIGH:-0} Critical/High finding(s). See the code-analyzer artifact."
            exit 1
          fi
          echo "✅ SCA gate passed — ${TOTAL:-0} finding(s), 0 Critical/High."

      - name: Upload SCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: sca-results/
          retention-days: 7   # SOX build-audit evidence: security scan per PR.

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.sca.outcome }}';
            const high = '${{ steps.sca.outputs.high }}' || '0';
            const total = '${{ steps.sca.outputs.total }}' || '0';
            const emoji = outcome === 'success' ? '✅' : '❌';
            const body = `${emoji} **SCA**: ${high} Critical/High, ${total} total (PMD + ESLint + Retire.js)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ---------------------------------------------------------------------------
  # Test-automation gate (added at account-team request): isolated automated suite.
  # The coverage gate above proves "enough lines were exercised." This gate proves
  # "the full automated suite ran green against the PR's actual code" and emits
  # JUnit XML as a first-class, standalone SOX build-audit artifact.
  #
  # Why a fresh scratch org per PR: running tests against the shared prod/sandbox
  # orgs would either race the matrix validation or test STALE code (the PR's new
  # classes aren't deployed there yet). An ephemeral org is the only way to run the
  # automated suite against exactly this PR's source in isolation. Org is always
  # deleted, even on failure.
  # Requires one new secret: SFDX_AUTH_URL_DEVHUB (an auth URL for the Dev Hub).
  # ---------------------------------------------------------------------------
  test-automation:
    name: Automated test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Node 20: SF CLI crashes on the runner's Node 24 default (see matrix job).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      - name: Authenticate to Dev Hub
        run: |
          # Same no-secret-at-rest pattern as the matrix job (Pattern 2): the auth
          # URL is piped through a transient FD, never written to disk.
          sf org login sfdx-url \
            --sfdx-url-file <(printf '%s' "${{ secrets.SFDX_AUTH_URL_DEVHUB }}") \
            --alias devhub \
            --set-default-dev-hub

      - name: Create ephemeral test scratch org
        run: |
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias pr-test \
            --duration-days 1 \
            --wait 10 \
            --set-default

      - name: Deploy PR source (no tests on deploy)
        run: |
          # Deploy without running tests, then run the suite explicitly so the
          # JUnit evidence is a clean, standalone artifact.
          sf project deploy start \
            --target-org pr-test \
            --source-dir force-app \
            --test-level NoTestRun \
            --wait 30

      - name: Run automated test suite (JUnit evidence)
        id: tests
        run: |
          mkdir -p test-results
          set +e
          sf apex run test \
            --target-org pr-test \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format junit \
            --output-dir test-results \
            --wait 30
          EXIT_CODE=$?
          set -e
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "::error::Automated test suite failed — see the junit-test-evidence artifact."
            exit 1
          fi
          echo "✅ Automated test suite passed."

      - name: Upload JUnit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-evidence
          path: test-results/
          retention-days: 7   # SOX build-audit evidence: tests-passed proof per PR.

      - name: Delete ephemeral scratch org
        if: always()   # Never leak a scratch org, even when the suite fails.
        run: |
          sf org delete scratch --target-org pr-test --no-prompt || true

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.tests.outcome }}';
            const emoji = outcome === 'success' ? '✅' : '❌';
            const body = `${emoji} **Test automation**: RunLocalTests on an isolated scratch org (JUnit evidence attached)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
